    // --- APPLICATION CONTROLLER ---
    function navigate(view) {
        // Toggle Sidebar Active State
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
        const activeNav = document.getElementById(`nav-${view}`);
        if(activeNav) activeNav.classList.add('active');

        const mainView = document.getElementById('main-view');
        mainView.innerHTML = ''; // Clear existing view

        const card = document.createElement('div');
        card.className = 'certification-card';

        if (view === 'theory') {
            card.innerHTML = `<h1>${DB.theory.title}</h1>${DB.theory.content}`;
        } 
        else if (view === 'cases') {
            let casesHTML = `<h1>Advanced CX Corporate Case Studies</h1>
                             <p class="theory-paragraph" style="color: var(--gold); font-weight: bold;">
                             ANALYSIS REQUIRED: Evaluate the operational failures and architectural solutions across the 25 corporate enterprise crises outlined below.</p>`;
            
            DB.cases.forEach((c) => {
                casesHTML += `
                    <div class="case-wrapper">
                        <div class="case-header">${c.title}</div>
                        <div class="case-content">
                            <h2>The Operational Breakdown</h2>
                            ${c.problem}
                        </div>
                        <div class="case-solution">
                            <h2>Architectural Resolution</h2>
                            ${c.solution}
                        </div>
                    </div>`;
            });
            card.innerHTML = casesHTML;
        } 
        else if (view === 'blueprints') {
            let blueprintsHTML = `<h1>Strategic Action Blueprints</h1>
                                  <p class="theory-paragraph">Operational drills have been replaced with Strategic Blueprints. Review each real-world challenge scenario below, type out your actionable leadership plan, and submit to evaluate your strategy against standard enterprise patterns.</p>`;
            
            DB.blueprints.forEach((b) => {
                blueprintsHTML += `
                    <div class="blueprint-block">
                        <div class="blueprint-header">${b.title}</div>
                        <div class="blueprint-body">
                            <div class="blueprint-instruction">${b.instruction}</div>
                            <textarea class="blueprint-textarea" id="textarea-${b.id}" placeholder="Type your strategic resolution roadmap here..."></textarea>
                            <button class="blueprint-btn" onclick="submitBlueprint(${b.id})">Submit Strategy For Review</button>
                            <div class="blueprint-feedback" id="feedback-${b.id}">${b.feedback}</div>
                        </div>
                    </div>`;
            });
            card.innerHTML = blueprintsHTML;
        }

        mainView.appendChild(card);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function submitBlueprint(id) {
        const textarea = document.getElementById(`textarea-${id}`);
        const feedback = document.getElementById(`feedback-${id}`);
        
        if (textarea.value.trim() === "") {
            alert("Please input your strategic blueprint text before requesting expert review.");
            return;
        }
        
        feedback.style.display = "block";
        feedback.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Initialize default view
    window.onload = () => {
        navigate('theory');
    };
</script>
